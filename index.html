<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="timer-app">
      <h1>タイマー</h1>
      <p id="display" class="display" aria-live="polite">00:00</p>
      <div class="controls">
        <button id="startStop" type="button">Start</button>
        <button id="reset" type="button">Reset</button>
        <button id="plusMinute" type="button">+1分</button>
        <button id="minusMinute" type="button">-1分</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
